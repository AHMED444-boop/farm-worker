name: Farm Worker

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  worker:
    runs-on: ubuntu-latest

    steps:
      - name: Run Farm Worker
        env:
          FARM_WORKER_TOKEN: ${{ secrets.FARM_WORKER_TOKEN }}
        run: |
          echo "================================"
          echo "Farm Worker started"
          echo "Time: $(date -u)"
          echo "================================"

          HTTP_CODE=$(curl -sS -o response.txt -w "%{http_code}" \
            -H "X-FARM-WORKER-TOKEN: ${FARM_WORKER_TOKEN}" \
            "https://magharet-alibaba.rf.gd/api/worker-run.php")

          echo "HTTP: ${HTTP_CODE}"
          echo "Response:"
          cat response.txt

          if [ "$HTTP_CODE" != "200" ]; then
            exit 1
          fi
